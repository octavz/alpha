app:
  name: alpha-backend
  version: "1.0.0"
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:5179"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

database:
  url: jdbc:postgresql://localhost:5433/alpha
  username: alpha_user
  password: alpha_password
  driver: org.postgresql.Driver
  hikari:
    maximum-pool-size: 10
    minimum-idle: 5
    connection-timeout: 30000
    idle-timeout: 600000
    max-lifetime: 1800000

flyway:
  enabled: true
  baseline-on-migrate: true
  baseline-version: "1"
  locations: classpath:db/migration
  validate-on-migrate: true
  clean-disabled: true

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_here}
  access-secret: ${JWT_ACCESS_SECRET:your_jwt_access_secret_here}
  refresh-secret: ${JWT_REFRESH_SECRET:your_jwt_refresh_secret_here}
  access-expiry: 15m
  refresh-expiry: 7d
  issuer: ${JWT_ISSUER:http://localhost:3000}

server:
  port: ${PORT:3000}

logging:
  level:
    root: INFO
    com.alpha: DEBUG
